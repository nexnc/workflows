name: Reusable Multi-Forge Mirror

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: false
        default: ""
        description: "Override repository name if different from GitHub"
      namespace:
        type: string
        required: false
        default: ""
        description: "GitLab/Codeberg user or org to mirror into (default: GitHub owner)"
    secrets:
      GITLAB_TOKEN:
        required: true
      CODEBERG_TOKEN:
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.repo_name != '' && inputs.repo_name || github.event.repository.name }}
      NS: ${{ inputs.namespace != '' && inputs.namespace || github.repository_owner }}
      DESCRIPTION: ${{ github.event.repository.description || '' }}
      TOPICS: ${{ toJson(github.event.repository.topics) }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync metadata & push to GitLab
        run: |
          set -euo pipefail
          [ -n "$GITLAB_TOKEN" ] || { echo "GITLAB_TOKEN is empty (secret not passed?)"; exit 1; }

          API="https://gitlab.com/api/v4"
          AUTH="PRIVATE-TOKEN: ${GITLAB_TOKEN}"

          # Resolve namespace (works for both users and groups)
          NS_ID=$(curl -sS -H "$AUTH" "$API/namespaces/${NS}" | jq -r '.id // empty')
          [ -n "$NS_ID" ] || { echo "GitLab namespace '${NS}' not found or token lacks access"; exit 1; }

          # Create project if missing
          if ! curl -sSf -o /dev/null -H "$AUTH" "$API/projects/${NS}%2F${TARGET}"; then
            jq -n --arg n "$TARGET" --argjson ns "$NS_ID" \
              '{name:$n, path:$n, namespace_id:$ns, visibility:"public"}' |
            curl -sSf -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d @- "$API/projects" > /dev/null
          fi

          # Sync description and topics
          jq -n --arg d "$DESCRIPTION" --argjson t "$TOPICS" \
            '{description:$d, topics:$t}' |
          curl -sSf -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            -d @- "$API/projects/${NS}%2F${TARGET}" > /dev/null

          # Push all branches and tags
          git push --prune --force "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${NS}/${TARGET}.git" \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"

      - name: Sync metadata & push to Codeberg
        run: |
          set -euo pipefail
          [ -n "$CODEBERG_TOKEN" ] || { echo "CODEBERG_TOKEN is empty (secret not passed?)"; exit 1; }

          API="https://codeberg.org/api/v1"
          AUTH="Authorization: token ${CODEBERG_TOKEN}"

          ME=$(curl -sSf -H "$AUTH" "$API/user" | jq -r '.login')

          # Create repo if missing
          if ! curl -sSf -o /dev/null -H "$AUTH" "$API/repos/${NS}/${TARGET}"; then
            if [ "$NS" = "$ME" ]; then CREATE="$API/user/repos"; else CREATE="$API/orgs/${NS}/repos"; fi
            jq -n --arg n "$TARGET" '{name:$n, private:false, auto_init:false}' |
            curl -sSf -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d @- "$CREATE" > /dev/null
          fi

          # Sync description
          jq -n --arg d "$DESCRIPTION" '{description:$d}' |
          curl -sSf -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
            -d @- "$API/repos/${NS}/${TARGET}" > /dev/null

          # Sync topics
          jq -n --argjson t "$TOPICS" '{topics:$t}' |
          curl -sSf -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            -d @- "$API/repos/${NS}/${TARGET}/topics" > /dev/null

          # Push all branches and tags
          git push --prune --force "https://${CODEBERG_TOKEN}@codeberg.org/${NS}/${TARGET}.git" \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
