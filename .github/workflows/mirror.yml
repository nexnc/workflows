name: Reusable Multi-Forge Mirror

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: false
        default: ""
        description: "Override repository name if different from GitHub"

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      ACTIONS_FLAGS_ALL_WARNINGS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-create & push to GitLab
        run: |
          TARGET="${{ inputs.repo_name != '' && inputs.repo_name || github.event.repository.name }}"

          # 1. Create project if missing
          curl --silent --request POST "https://gitlab.com/api/v4/projects" \
            --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"name\": \"${TARGET}\", \"visibility\": \"public\"}" > /dev/null || true

          # 2. Push mirror refs
          git push --prune --force "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/nexnc/${TARGET}.git" \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"

      - name: Auto-create & push to Codeberg
        run: |
          TARGET="${{ inputs.repo_name != '' && inputs.repo_name || github.event.repository.name }}"

          # 1. Create repo and print exact HTTP response code & body
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://codeberg.org/api/v1/user/repos" \
            -H "Authorization: Bearer ${{ secrets.CODEBERG_TOKEN }}" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${TARGET}\", \"private\": false}")
          
          echo "Codeberg API Response:"
          echo "$RESPONSE"

          # 2. Push mirror refs
          git push --prune --force "https://${{ secrets.CODEBERG_TOKEN }}@codeberg.org/nexnc/${TARGET}.git" \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
